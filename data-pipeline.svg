<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300" fill="none" role="img" aria-label="Narasimha Royal, Data Analyst. From messy data to trusted decisions: sources, SQL, validation, modeling, insight, decision.">
  <defs>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ba1e3"/>
      <stop offset="0.5" stop-color="#9168cf"/>
      <stop offset="1" stop-color="#ec5f78"/>
    </linearGradient>
  </defs>

  <!-- ===== NAME + TITLE ===== -->
  <text x="530" y="44" text-anchor="middle" fill="url(#gem)" font-size="38" font-weight="800"
        font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" letter-spacing="2">NARASIMHA ROYAL</text>
  <text x="530" y="72" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="600"
        font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" letter-spacing="5">DATA ANALYST &#160;&#183;&#160; PYTHON &#160;&#183;&#160; SQL &#160;&#183;&#160; BI</text>

  <!-- ===== DOTTED CONNECTORS between cards (marching dots) ===== -->
  <g stroke="url(#gem)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.1 9">
    <line x1="172" y1="146" x2="216" y2="146"><animate attributeName="stroke-dashoffset" from="0" to="-9.1" dur="0.55s" repeatCount="indefinite" calcMode="linear"/></line>
    <line x1="340" y1="146" x2="384" y2="146"><animate attributeName="stroke-dashoffset" from="0" to="-9.1" dur="0.55s" repeatCount="indefinite" calcMode="linear"/></line>
    <line x1="508" y1="146" x2="552" y2="146"><animate attributeName="stroke-dashoffset" from="0" to="-9.1" dur="0.55s" repeatCount="indefinite" calcMode="linear"/></line>
    <line x1="676" y1="146" x2="720" y2="146"><animate attributeName="stroke-dashoffset" from="0" to="-9.1" dur="0.55s" repeatCount="indefinite" calcMode="linear"/></line>
    <line x1="844" y1="146" x2="888" y2="146"><animate attributeName="stroke-dashoffset" from="0" to="-9.1" dur="0.55s" repeatCount="indefinite" calcMode="linear"/></line>
  </g>

  <!-- ===== BAD-DATA branch caught at VALIDATE ===== -->
  <line x1="446" y1="182" x2="446" y2="226" stroke="#ec5f78" stroke-width="2" stroke-dasharray="3 4" opacity="0.6"/>
  <circle r="3" cx="446" fill="#ec5f78">
    <animate attributeName="cy" values="182;226" dur="2.2s" begin="0s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" cx="446" fill="#ec5f78">
    <animate attributeName="cy" values="182;226" dur="2.2s" begin="1.1s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <rect x="378" y="226" width="136" height="42" rx="9" fill="#0d1117" stroke="#ec5f78" stroke-width="1.4"/>
  <text x="446" y="243" text-anchor="middle" fill="#ec8a9c" font-size="11.5" font-weight="800"
        font-family="'Segoe UI',Roboto,sans-serif">~150 BAD ROWS</text>
  <text x="446" y="259" text-anchor="middle" fill="#b9707e" font-size="10" font-weight="600"
        font-family="'Segoe UI',Roboto,sans-serif" letter-spacing="1">CAUGHT WEEKLY</text>

  <!-- ===== STAGE CARDS ===== -->
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <!-- SOURCES -->
    <g>
      <rect x="50" y="110" width="120" height="72" rx="12" fill="#0d1117" stroke="url(#gem)" stroke-width="1.8"/>
      <rect x="62" y="121" width="96" height="3.5" rx="2" fill="#1ba1e3"/>
      <text x="110" y="152" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="800">SOURCES</text>
      <text x="110" y="170" text-anchor="middle" fill="#8b949e" font-size="10.5" font-weight="500">APIs &#183; files &#183; DB</text>
    </g>
    <!-- SQL -->
    <g>
      <rect x="218" y="110" width="120" height="72" rx="12" fill="#0d1117" stroke="url(#gem)" stroke-width="1.8"/>
      <rect x="230" y="121" width="96" height="3.5" rx="2" fill="#4f8fde"/>
      <text x="278" y="152" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="800">SQL</text>
      <text x="278" y="170" text-anchor="middle" fill="#8b949e" font-size="10.5" font-weight="500">extract &#183; join</text>
    </g>
    <!-- VALIDATE (highlighted differentiator) -->
    <g>
      <rect x="386" y="110" width="120" height="72" rx="12" fill="#161b22" stroke="#9168cf" stroke-width="2.4"/>
      <rect x="398" y="121" width="96" height="3.5" rx="2" fill="#9168cf"/>
      <text x="446" y="152" text-anchor="middle" fill="#c9b6ff" font-size="15" font-weight="800">VALIDATE</text>
      <text x="446" y="170" text-anchor="middle" fill="#a9b1bb" font-size="10.5" font-weight="500">quality &#183; reconcile</text>
    </g>
    <!-- MODEL -->
    <g>
      <rect x="554" y="110" width="120" height="72" rx="12" fill="#0d1117" stroke="url(#gem)" stroke-width="1.8"/>
      <rect x="566" y="121" width="96" height="3.5" rx="2" fill="#c861a8"/>
      <text x="614" y="152" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="800">MODEL</text>
      <text x="614" y="170" text-anchor="middle" fill="#8b949e" font-size="10.5" font-weight="500">clean tables</text>
    </g>
    <!-- INSIGHT -->
    <g>
      <rect x="722" y="110" width="120" height="72" rx="12" fill="#0d1117" stroke="url(#gem)" stroke-width="1.8"/>
      <rect x="734" y="121" width="96" height="3.5" rx="2" fill="#ec5f78"/>
      <text x="782" y="152" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="800">INSIGHT</text>
      <text x="782" y="170" text-anchor="middle" fill="#8b949e" font-size="10.5" font-weight="500">Power BI &#183; Tableau</text>
    </g>
    <!-- DECISION -->
    <g>
      <rect x="890" y="110" width="120" height="72" rx="12" fill="#0d1117" stroke="url(#gem)" stroke-width="1.8"/>
      <rect x="902" y="121" width="96" height="3.5" rx="2" fill="#e8c15a"/>
      <text x="950" y="152" text-anchor="middle" fill="#eed384" font-size="15" font-weight="800">DECISION</text>
      <text x="950" y="170" text-anchor="middle" fill="#8b949e" font-size="10.5" font-weight="500">people act on it</text>
    </g>
  </g>

  <!-- ===== CAPTION ===== -->
  <text x="530" y="290" text-anchor="middle" fill="#6b7682" font-size="11.5" letter-spacing="2" font-weight="600"
        font-family="'Segoe UI',Roboto,sans-serif">MESSY DATA &#8594; VALIDATED &#8594; MODELED &#8594; INSIGHT &#8594; DECISION</text>
</svg>
